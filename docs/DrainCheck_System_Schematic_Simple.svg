<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" role="img" aria-labelledby="title desc">
<title id="title">How DrainCheck works</title>
<desc id="desc">Three simplified flows: terrain depression ranking to a relative ponding heatmap, flood evidence and buildings to review priorities, and assumed drainage loss to a baseline-versus-clogged local storage comparison.</desc>
<rect x="0" y="0" width="1920" height="1080" rx="0" fill="#F5F7F6" stroke="#F5F7F6"/>
<text x="80" y="67" fill="#087D80" font-family="Segoe UI,Arial,sans-serif" font-size="18" font-weight="700">DRAINCHECK</text>
<text x="80" y="137" fill="#17343F" font-family="Segoe UI,Arial,sans-serif" font-size="53" font-weight="700">How DrainCheck works</text>
<text x="80" y="180" fill="#526B74" font-family="Segoe UI,Arial,sans-serif" font-size="25" font-weight="400">Terrain, past floods and drainage scenarios.</text>
<rect x="1455" y="88" width="385" height="61" rx="13" fill="#E7F0EF" stroke="#D0E0DD"/>
<text x="1478" y="127" fill="#087D80" font-family="Segoe UI,Arial,sans-serif" font-size="24" font-weight="600">1 m terrain  ·  5 m analysis</text>
<text x="80" y="239" fill="#526B74" font-family="Segoe UI,Arial,sans-serif" font-size="15" font-weight="700">INPUT</text>
<text x="598" y="239" fill="#526B74" font-family="Segoe UI,Arial,sans-serif" font-size="15" font-weight="700">METHOD</text>
<text x="1390" y="239" fill="#526B74" font-family="Segoe UI,Arial,sans-serif" font-size="15" font-weight="700">OUTPUT</text>
<rect x="80" y="275" width="450" height="142" rx="16" fill="#FFFFFF" stroke="#D8E2E5"/>
<rect x="80" y="275" width="5" height="142" rx="2" fill="#087D80" stroke="#087D80"/>
<text x="106" y="312" fill="#087D80" font-family="Segoe UI,Arial,sans-serif" font-size="15" font-weight="700">01  TERRAIN</text>
<text x="106" y="366" fill="#17343F" font-family="Segoe UI,Arial,sans-serif" font-size="30" font-weight="600">Municipal 1 m DTM</text>
<text x="727.77099609375" y="324" fill="#526B74" font-family="Segoe UI,Arial,sans-serif" font-size="26" font-weight="400">Rank depression fill depth on a 5 m grid.</text>
<line x1="553" y1="356" x2="1360" y2="356" stroke="#087D80" stroke-width="2"/>
<polygon points="1367,356 1357,350 1357,362" fill="#087D80"/>
<rect x="1390" y="275" width="450" height="142" rx="16" fill="#FFFFFF" stroke="#D8E2E5"/>
<rect x="1390" y="275" width="5" height="142" rx="2" fill="#087D80" stroke="#087D80"/>
<text x="1416" y="307" fill="#087D80" font-family="Segoe UI,Arial,sans-serif" font-size="15" font-weight="700">TERRAIN VIEW</text>
<text x="1416" y="349" fill="#17343F" font-family="Segoe UI,Arial,sans-serif" font-size="31" font-weight="600">Ponding heatmap</text>
<text x="1416" y="387" fill="#526B74" font-family="Segoe UI,Arial,sans-serif" font-size="22" font-weight="400">Relative signal · 0–100</text>
<rect x="80" y="475" width="450" height="142" rx="16" fill="#FFFFFF" stroke="#D8E2E5"/>
<rect x="80" y="475" width="5" height="142" rx="2" fill="#5263A5" stroke="#5263A5"/>
<text x="106" y="512" fill="#5263A5" font-family="Segoe UI,Arial,sans-serif" font-size="15" font-weight="700">02  FLOOD EVIDENCE</text>
<text x="106" y="566" fill="#17343F" font-family="Segoe UI,Arial,sans-serif" font-size="30" font-weight="600">Past floods + buildings</text>
<text x="689.38671875" y="524" fill="#526B74" font-family="Segoe UI,Arial,sans-serif" font-size="26" font-weight="400">Combine ponding, floods and building overlap.</text>
<line x1="553" y1="556" x2="1360" y2="556" stroke="#5263A5" stroke-width="2"/>
<polygon points="1367,556 1357,550 1357,562" fill="#5263A5"/>
<rect x="1390" y="475" width="450" height="142" rx="16" fill="#FFFFFF" stroke="#D8E2E5"/>
<rect x="1390" y="475" width="5" height="142" rx="2" fill="#5263A5" stroke="#5263A5"/>
<text x="1416" y="507" fill="#5263A5" font-family="Segoe UI,Arial,sans-serif" font-size="15" font-weight="700">EVIDENCE VIEW</text>
<text x="1416" y="549" fill="#17343F" font-family="Segoe UI,Arial,sans-serif" font-size="31" font-weight="600">Review priorities</text>
<text x="1416" y="587" fill="#526B74" font-family="Segoe UI,Arial,sans-serif" font-size="22" font-weight="400">Past floods take precedence</text>
<rect x="80" y="675" width="450" height="142" rx="16" fill="#FFFFFF" stroke="#D8E2E5"/>
<rect x="80" y="675" width="5" height="142" rx="2" fill="#B56125" stroke="#B56125"/>
<text x="106" y="712" fill="#B56125" font-family="Segoe UI,Arial,sans-serif" font-size="15" font-weight="700">03  WHAT-IF SCENARIO</text>
<text x="106" y="766" fill="#17343F" font-family="Segoe UI,Arial,sans-serif" font-size="30" font-weight="600">Selected pipes + rain</text>
<text x="692.80810546875" y="724" fill="#526B74" font-family="Segoe UI,Arial,sans-serif" font-size="26" font-weight="400">Reduce assumed drainage near selected pipes.</text>
<line x1="553" y1="756" x2="1360" y2="756" stroke="#B56125" stroke-width="2"/>
<polygon points="1367,756 1357,750 1357,762" fill="#B56125"/>
<rect x="1390" y="675" width="450" height="142" rx="16" fill="#FFFFFF" stroke="#D8E2E5"/>
<rect x="1390" y="675" width="5" height="142" rx="2" fill="#B56125" stroke="#B56125"/>
<text x="1416" y="707" fill="#B56125" font-family="Segoe UI,Arial,sans-serif" font-size="15" font-weight="700">STORM COMPARISON</text>
<text x="1416" y="749" fill="#17343F" font-family="Segoe UI,Arial,sans-serif" font-size="27" font-weight="600">Baseline / clogged / change</text>
<text x="1416" y="787" fill="#526B74" font-family="Segoe UI,Arial,sans-serif" font-size="22" font-weight="400">Estimated local depth + excess runoff</text>
<rect x="80" y="865" width="1760" height="75" rx="13" fill="#EAF2EC" stroke="#D5E2D8"/>
<text x="103" y="911" fill="#38754B" font-family="Segoe UI,Arial,sans-serif" font-size="24" font-weight="400">Mapped water and uncertain terrain excluded; mapped greens assumed to absorb all rain.</text>
<line x1="80" y1="978" x2="1840" y2="978" stroke="#D8E2E5" stroke-width="1"/>
<text x="80" y="1014" fill="#17343F" font-family="Segoe UI,Arial,sans-serif" font-size="24" font-weight="600">Comparative screening, not a calibrated flood forecast.</text>
<text x="80" y="1049" fill="#526B74" font-family="Segoe UI,Arial,sans-serif" font-size="22" font-weight="400">Local storage estimates; no flow routing or sewer hydraulics.</text>
</svg>